<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gartenmond</title>
<meta name="theme-color" content="#2E5B3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gartenmond">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
/* Layout: eine ruhige Spalte (max 980px), Mond-Kopf als einziger Blickfang, Navigation unten am Handy, oben am Desktop */
:root{
  --bg:#F1F4ED; --surface:#FBFCF8; --surface-2:#E8EEE4; --ink:#1C2620; --muted:#5D6A60; --line:#D9E0D3;
  --accent:#2E5B3D; --accent-ink:#F4F8F2; --accent-soft:#DFE9DC; --bloom:#954F74; --bloom-soft:#F1E2EA;
  --moon-lit:#EDE3BC; --moon-dark:#2C362F; --halo:rgba(237,227,188,.0);
  --el-B:#954F74; --el-L:#3B7547; --el-F:#A8731C; --el-W:#7A5636;
  --t-schnitt:#8A4C6E; --t-duengen:#7F7418; --t-pflanzen:#7A5636; --t-schutz:#4A6884; --t-pflege:#3B7547; --t-ernte:#A8731C;
  --danger:#A3392F; --warn:#9A6A12;
  --f-display:"Young Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(28,38,32,.06), 0 8px 24px -12px rgba(28,38,32,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101511; --surface:#171E18; --surface-2:#1E2720; --ink:#E2E9DE; --muted:#97A498; --line:#29342B;
  --accent:#8EBC94; --accent-ink:#0F1A12; --accent-soft:#1E2D22; --bloom:#D59BBA; --bloom-soft:#33222C;
  --moon-lit:#F1E8C6; --moon-dark:#252E27;
  --el-B:#D59BBA; --el-L:#86C08E; --el-F:#E0B262; --el-W:#C69C74;
  --t-schnitt:#D59BBA; --t-duengen:#CFC26A; --t-pflanzen:#C69C74; --t-schutz:#93B2CF; --t-pflege:#86C08E; --t-ernte:#E0B262;
  --danger:#E6877C; --warn:#E1B45E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101511; --surface:#171E18; --surface-2:#1E2720; --ink:#E2E9DE; --muted:#97A498; --line:#29342B;
  --accent:#8EBC94; --accent-ink:#0F1A12; --accent-soft:#1E2D22; --bloom:#D59BBA; --bloom-soft:#33222C;
  --moon-lit:#F1E8C6; --moon-dark:#252E27;
  --el-B:#D59BBA; --el-L:#86C08E; --el-F:#E0B262; --el-W:#C69C74;
  --t-schnitt:#D59BBA; --t-duengen:#CFC26A; --t-pflanzen:#C69C74; --t-schutz:#93B2CF; --t-pflege:#86C08E; --t-ernte:#E0B262;
  --danger:#E6877C; --warn:#E1B45E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.005em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 120px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Kopf */
.top{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:22px}
.brand svg{color:var(--accent)}
.topnav{display:none;gap:4px;margin-left:auto;background:var(--surface-2);padding:4px;border-radius:999px}
.topnav button{border:0;background:transparent;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
.topnav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.me-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600;margin-left:auto}
.ini{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ini.lg{width:34px;height:34px;font-size:14px}
button.me-chip{cursor:pointer}
body.gated .bottomnav,body.gated .topnav{display:none!important}
.gate{max-width:440px;margin:6vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;display:flex;flex-direction:column;gap:12px}
.gate h2{font-size:30px;line-height:1.1}
.gate p{margin:0}
.gate input{font-size:16px}
.gate-moon{width:84px;height:84px;position:relative;margin-bottom:4px}
.gate-moon::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle, color-mix(in oklab, var(--moon-lit) 45%, transparent), transparent 68%)}
.gate-moon svg{position:relative}
.gate-msg{color:var(--danger);font-size:14px}
code{font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
@media (min-width:860px){.topnav{display:flex}.me-chip{margin-left:0}.bottomnav{display:none!important}.wrap{padding-bottom:48px}}

/* Mond-Held */
.hero{position:relative;overflow:hidden;border-radius:22px;background:
  radial-gradient(120% 90% at 88% 10%, color-mix(in oklab, var(--moon-lit) 26%, transparent) 0%, transparent 55%),
  linear-gradient(160deg, var(--accent-soft), var(--surface) 70%);
  border:1px solid var(--line);padding:22px 22px 18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.hero .sprig{position:absolute;left:-18px;bottom:-26px;width:170px;opacity:.22;color:var(--accent);pointer-events:none}
.hero-text{position:relative;min-width:0}
.hero h2{font-size:clamp(26px,5.4vw,40px);line-height:1.08;margin:6px 0 6px}
.hero h2 em{font-style:normal;color:var(--el)}
.hero .sub{color:var(--muted);font-size:14.5px}
.hero-moon{position:relative;width:110px;height:110px;display:grid;place-items:center}
.hero-moon::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle, color-mix(in oklab, var(--moon-lit) 45%, transparent), transparent 68%)}
.hero-moon svg{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.chip.good{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
@media (max-width:520px){.hero{grid-template-columns:1fr;padding:18px}.hero-moon{position:absolute;right:12px;top:12px;width:72px;height:72px}.hero-moon svg{width:58px;height:58px}.hero h2{padding-right:70px}}

/* Mondstreifen */
.strip{display:flex;gap:4px;overflow-x:auto;padding:4px 2px 8px;margin-top:14px;scrollbar-width:thin}
.sd{flex:0 0 40px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:11px}
.sd b{font-size:13px;font-weight:600}
.sd i{display:block;width:18px;height:3px;border-radius:2px;background:var(--el)}
.sd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sd .ar{font-size:10px;color:var(--muted);line-height:1}

/* Sektionen */
section.block{margin-top:26px}
.block-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.block-head h2{font-size:24px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 11px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:10px;scrollbar-width:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.custom-range{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
input[type=date],input[type=text],input[type=email],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px}
.custom-range input{width:auto}

/* Aufgaben */
.week{margin-top:20px}
.week-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.week-h h3{font-size:18px}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.task.open{box-shadow:var(--shadow)}
.dayb{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--surface-2);padding:6px 0 7px;line-height:1.1;position:relative}
.dayb small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.dayb b{font-family:var(--f-display);font-weight:400;font-size:22px}
.dayb .el{position:absolute;bottom:-3px;width:22px;height:4px;border-radius:2px;background:var(--el)}
.tmain{min-width:0}
.ttype{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.ttype svg{width:15px;height:15px}
.tname{font-weight:600;font-size:15.5px;margin-top:1px}
.tzone{color:var(--muted);font-size:13px}
.tbody{margin-top:8px;font-size:14px;color:var(--ink);max-width:62ch}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.q{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.q.ideal{background:var(--accent-soft);color:var(--accent)}
.q.gut{background:var(--surface-2);color:var(--ink)}
.q.moeglich{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.why{font-size:12.5px;color:var(--muted);margin-top:6px}
.tact{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--ink)}
.iconbtn.check{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 40%, var(--line))}
.iconbtn.check:hover{background:var(--accent);color:var(--accent-ink)}
.iconbtn svg{width:18px;height:18px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13px}
.task.isdone{opacity:.62}
.task.isdone .tname{text-decoration:line-through}
details.donebox{margin-top:16px}
details.donebox summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
@media (max-width:420px){.task{grid-template-columns:50px 1fr;}.tact{grid-column:1/-1;flex-direction:row;justify-content:flex-end}}

/* Tipps */
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tip h3{font-size:16px;margin-bottom:6px}
.tip ul{margin:0;padding-left:18px;font-size:14px}
.tip li+li{margin-top:4px}

/* Leerzustand */
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:28px 20px;text-align:center;background:var(--surface)}
.empty svg{color:var(--accent);margin-bottom:6px}
.empty h3{font-size:20px;margin-bottom:4px}
.empty p{color:var(--muted);max-width:44ch;margin:0 auto 14px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 40%,var(--line))}
.btn.danger.sure{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* Zonen */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.zone::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--zc);opacity:.13}
.zone h3{font-size:20px}
.zone .glyphs{display:flex;gap:2px;flex-wrap:wrap;color:var(--accent);min-height:30px}
.zone .meta{display:flex;gap:6px;flex-wrap:wrap}
.zone-detail-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.zone-detail-head .zdot{width:14px;height:14px;border-radius:50%;background:var(--zc);margin-top:10px}
.back{border:0;background:none;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:4px 0;margin-bottom:8px}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pl{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.pl .g{width:52px;height:52px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.pl .pn{font-weight:600}
.pl .pb{font-size:13px;color:var(--muted);font-style:italic}
.pl .pnote{font-size:13px;color:var(--muted)}
.badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--bloom-soft);color:var(--bloom)}

/* Katalog */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;text-align:left}
.pc:hover{border-color:var(--accent)}
.pc .g{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.pc .pn{font-weight:600;line-height:1.25}
.pc .pb{font-size:12.5px;color:var(--muted);font-style:italic}
.pc .icons{display:flex;gap:8px;font-size:11.5px;color:var(--muted);margin-top:2px}
.searchbar{display:flex;gap:8px;align-items:center}
.searchbar input{flex:1}

/* Mondkalender */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;text-align:center;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding-bottom:4px}
.cd{aspect-ratio:1/1.1;max-width:100%;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px 6px;font-size:12px;position:relative}
.cd.out{visibility:hidden}
.cd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cd.sel{background:var(--accent-soft)}
.cd b{font-weight:600}
.cd .el{width:60%;height:4px;border-radius:2px;background:var(--el)}
.cd .ar{position:absolute;top:4px;right:5px;font-size:10px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;background:var(--el)}
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:14px}
.explain .tip p{margin:0;font-size:14px}
.note{border-left:3px solid var(--warn);background:var(--surface);padding:12px 14px;border-radius:0 12px 12px 0;font-size:14px;margin-top:14px;max-width:75ch}

/* Team */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.role.mine{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.role h3{font-size:18px;margin-bottom:4px}
.role ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.members{display:flex;flex-direction:column;gap:8px}
.member{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.member img{width:32px;height:32px;border-radius:50%}
.steps{margin:0;padding-left:20px;font-size:14px;max-width:70ch}
.steps li+li{margin-top:6px}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px;max-height:86%}}
.sheet-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sheet-h h2{font-size:24px;line-height:1.15}
.form{display:flex;flex-direction:column;gap:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:8px}
.swatches label{width:30px;height:30px;border-radius:50%;background:var(--sw);display:grid;place-items:center;cursor:pointer;border:2px solid transparent}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches input:checked + span{outline:2px solid var(--ink);outline-offset:3px;border-radius:50%;width:30px;height:30px;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.yearplan{overflow-x:auto;margin-top:6px}
.yp{display:grid;grid-template-columns:110px repeat(12,minmax(22px,1fr));gap:2px 0;align-items:center;min-width:420px;font-size:12px}
.yp .mh{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700}
.yp .lab{font-weight:600;font-size:12px;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yp .bar{height:10px;border-radius:5px;background:var(--c)}
.yp .cur{outline:1px dashed var(--muted);outline-offset:1px}
.steckbrief p{margin:0 0 10px;max-width:62ch}

        Mp=(134.9633964+477198.8675055*T)*rad, F=(93.2720950+483202.0175233*T)*rad;
  const lon=nrm(L0+6.289*S(Mp)+1.274*S(2*D-Mp)+0.658*S(2*D)+0.214*S(2*Mp)-0.186*S(M)-0.114*S(2*F)+0.059*S(2*D-2*Mp)+0.057*S(2*D-M-Mp)+0.053*S(2*D+Mp)+0.046*S(2*D-M)-0.041*S(M-Mp)-0.035*S(D)-0.031*S(M+Mp));

  const g=(357.529+35999.050*T)*rad, sun=nrm(280.466+36000.770*T+1.915*S(g)+0.020*S(2*g));

/* ---------- Plan berechnen ---------- */
function rangeDates(){
  if(UI.range==="custom"){let f=pkey(UI.from),t=pkey(UI.to);if(t<f)[f,t]=[t,f];if((t-f)/DAY>366)t=addD(f,366);return [f,t]}
  return [TODAY,addD(TODAY,Number(UI.range))];
}
function windowsFor(task,rs,re){
  const [ , f, t]=task; const [fm,fd]=f.split("-").map(Number), [tm,td]=t.split("-").map(Number); const out=[];
  for(let y=rs.getFullYear()-1;y<=re.getFullYear();y++){
    const from=new Date(y,fm-1,fd); let to=new Date(y,tm-1,td); if(to<from) to=new Date(y+1,tm-1,td);
    if(to>=rs&&from<=re) out.push({from,to,y});
  }
  return out;
}
function buildPlan(){
  const [rs,re]=rangeDates(); const items=[];
  const zmap=Object.fromEntries(S.zones.map(z=>[z.id,z]));
  for(const p of S.plantings){
    const c=CAT[p.cat]; if(!c) continue; const z=zmap[p.zoneId]; if(!z) continue;
    if(UI.zoneF!=="all"&&p.zoneId!==UI.zoneF) continue;
    const planned=p.status==="geplant";
    c.t.forEach(task=>{
      const [type,f,,txt]=task;
      if(type==="pflanzen"&&!planned) return;
      if(planned&&!["pflanzen","auspflanzen"].includes(type)) return;
      if(UI.typeF!=="all"&&groupOf(type)!==UI.typeF) return;
      for(const w of windowsFor(task,rs,re)){
        const s=w.from>rs?w.from:rs, e=w.to<re?w.to:re;
        const cands=[];
        for(let d=sod(s);d<=e;d=addD(d,1)){const m=moon(d);const sc=scoreDay(type,m,c.e);cands.push({d,m,...sc})}
        if(!cands.length) continue;
        const sorted=[...cands].sort((a,b)=>b.s-a.s||a.d-b.d);
        const best=sorted[0]; const alts=[];
        for(const x of sorted.slice(1)){ if(alts.length>=2) break; if(x.s<best.s-1) break; if([best,...alts].every(o=>Math.abs(o.d-x.d)>=3*DAY)) alts.push(x)}
        const tid=`${type}-${f}`, dk=`${p.id}~${tid}~${w.y}`;
        items.push({p,c,z,type,txt,tid,dk,best,alts,win:w,done:S.done[dk]||null,qual:quality(type,best.s)});
      }
    });
  }
  items.sort((a,b)=>a.best.d-b.best.d||a.z.name.localeCompare(b.z.name));
  return {items,rs,re};
}
const groupOf=t=>({auspflanzen:"pflanzen",teilen:"pflanzen",aussaat:"ernte"}[t]||t);

/* Zonen */
const ZCOLORS=["#3B7547","#954F74","#A8731C","#4A6884","#7A5636"];
function vZonen(){
  if(UI.zone){const z=S.zones.find(x=>x.id===UI.zone); if(z) return vZone(z); UI.zone=null}
  const cnt=id=>S.plantings.filter(p=>p.zoneId===id).reduce((a,p)=>a+(p.count||1),0);
  const cards=S.zones.map(z=>{
    const ps=S.plantings.filter(p=>p.zoneId===z.id);
    const cats=[...new Set(ps.map(p=>CAT[p.cat]?.c).filter(Boolean))].slice(0,6);
    return `<button class="zone" data-zone="${esc(z.id)}" style="--zc:${esc(z.color||"var(--accent)")}">
      <div class="eyebrow">${esc(z.kind||"Zone")}</div>
      <h3>${esc(z.name)}</h3>
      <div class="glyphs">${cats.length?cats.map(c=>glyph(c,28)).join(""):'<span class="muted" style="font-size:13px">Noch leer</span>'}</div>
      <div class="meta"><span class="chip">${esc(z.light||"Sonne")}</span><span class="chip num">${cnt(z.id)} ${cnt(z.id)===1?"Pflanze":"Pflanzen"}</span></div>
    </button>`}).join("");
  return `<section class="block" style="margin-top:6px">
    <div class="block-head"><h2>Zonen</h2><span class="muted">Orte im Garten, denen ihr Pflanzen zuordnet.</span><span class="spacer"></span>
      ${me.canZones?`<button class="btn primary" data-newzone>${plus()}Neue Zone</button>`:""}</div>
    ${!S.ready.zones&&!me.local?`<p class="muted">Lade Zonen …</p>`:S.zones.length?`<div class="zones">${cards}</div>`:
      `<div class="empty">${glyph("Sträucher",44)}<h3>Legt eure erste Zone an</h3><p>Zum Beispiel „Vorgarten“, „Terrasse Kübel“ oder „Hecke Nord“. Lage und Art helfen später bei der Einordnung.</p>${me.canZones?`<button class="btn primary" data-newzone>${plus()}Erste Zone anlegen</button>`:`<p class="muted">Zonen anlegen dürfen Besitzer und Verwalter.</p>`}</div>`}
  </section>`;
}
const plus=()=>`<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
function vZone(z){
  const ps=S.plantings.filter(p=>p.zoneId===z.id).sort((a,b)=>(CAT[a.cat]?.n||"").localeCompare(CAT[b.cat]?.n||""));
  const rows=ps.map(p=>{const c=CAT[p.cat];if(!c)return"";return `<div class="pl">
    <div class="g">${glyph(c.c,34)}</div>
    <div style="min-width:0"><div class="pn">${esc(c.n)}${p.count>1?` <span class="muted num">× ${p.count}</span>`:""} ${p.status==="geplant"?'<span class="badge">geplant</span>':""}</div><div class="pb">${esc(c.b)}</div>${p.note?`<div class="pnote">${esc(p.note)}</div>`:""}</div>
    <div class="row" style="gap:6px"><button class="iconbtn" data-info="${esc(c.id)}" aria-label="Steckbrief"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v5M12 8v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    ${me.canPlants?`<button class="iconbtn" data-editp="${esc(p.id)}" aria-label="Bearbeiten"><svg viewBox="0 0 24 24"><path d="M5 19h3.5L18 9.5 14.5 6 5 15.5V19ZM13 7.5l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>`:""}</div>
  </div>`}).join("");
  return `<section class="block" style="margin-top:4px">
    <button class="back" data-back><svg width="16" height="16" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Alle Zonen</button>
    <div class="zone-detail-head" style="--zc:${esc(z.color||"var(--accent)")}"><span class="zdot"></span><div style="min-width:0;flex:1"><div class="eyebrow">${esc(z.kind||"Zone")} · ${esc(z.light||"Sonne")}</div><h2 style="font-size:30px">${esc(z.name)}</h2>${z.note?`<p class="muted" style="margin:4px 0 0;max-width:60ch">${esc(z.note)}</p>`:""}</div>
      <div class="row">${me.canZones?`<button class="btn" data-editzone="${esc(z.id)}">Zone bearbeiten</button>`:""}${me.canPlants?`<button class="btn primary" data-addplant="${esc(z.id)}">${plus()}Pflanze</button>`:""}</div></div>
    ${ps.length?`<div class="plist">${rows}</div>`:`<div class="empty" style="margin-top:16px">${glyph("Kübelpflanzen",44)}<h3>Hier wächst noch nichts</h3><p>Wählt Pflanzen aus dem Katalog. Pflegezeiten und Mondtage kommen automatisch dazu.</p>${me.canPlants?`<button class="btn primary" data-addplant="${esc(z.id)}">${plus()}Pflanze aus dem Katalog</button>`:""}</div>`}

/* Katalog */
function vKatalog(){
  return `<section class="block" style="margin-top:6px">
    <div class="block-head"><h2>Pflanzenkatalog</h2><span class="muted">${CATALOG.length} Gartenpflanzen mit Pflegeplan</span></div>

    <div id="catlist"></div>
  </section>`;
}
function catFilter(q,cat){
  q=(q||"").trim().toLowerCase();
  return CATALOG.filter(c=>(cat==="Alle"||c.c===cat)&&(!q||(c.n+" "+c.b+" "+c.c).toLowerCase().includes(q)));
}
const water=w=>["","wenig Wasser","mittel Wasser","viel Wasser"][w];
function renderCatList(){
  const el=$("#catlist"); if(!el) return;
  const list=catFilter(UI.catQ,UI.catC);
  el.innerHTML=list.length?`<div class="cat-grid">${list.map(c=>`<button class="pc" data-info="${c.id}"><div class="g">${glyph(c.c,32)}</div><div style="min-width:0"><div class="pn">${esc(c.n)}</div><div class="pb">${esc(c.b)}</div><div class="icons"><span>${esc(c.l)}</span><span>${water(c.w)}</span></div></div></button>`).join("")}</div>`:`<p class="muted" style="margin-top:14px">Keine Pflanze gefunden. Fehlt eine? Sag mir Bescheid, dann ergänze ich den Katalog.</p>`;
}

/* Mondkalender */
function vMond(){
  const m0=UI.calM, y=m0.getFullYear(), mo=m0.getMonth();
  const first=new Date(y,mo,1), lead=(first.getDay()+6)%7, days=new Date(y,mo+1,0).getDate();
  let cells=["Mo","Di","Mi","Do","Fr","Sa","So"].map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i=0;i<lead;i++) cells+=`<div class="cd out"></div>`;
  for(let d=1;d<=days;d++){const dt=new Date(y,mo,d),m=moon(dt),k=dkey(dt);
    cells+=`<button class="cd ${k===dkey(TODAY)?"today":""} ${k===UI.calSel?"sel":""}" data-cal="${k}" style="--el:var(${EL[m.el].v})" aria-label="${esc(fLong(dt))}, ${esc(m.phase)}, ${EL[m.el].n}"><span class="ar">${m.asc?"↑":"↓"}</span><b class="num">${d}</b>${moonSVG(m,18)}<span class="el"></span></button>`}
  const sd=pkey(UI.calSel), sm=moon(sd), se=EL[sm.el];
  const actions=Object.entries({schnitt:"Rückschnitt",duengen:"Düngen",pflanzen:"Pflanzen & Umsetzen",ernte:"Ernte",aussaat:"Säen",schutz:"Winterschutz"}).map(([t,l])=>{const {s}=scoreDay(t,sm,sm.el);const q=quality(t,s);return `<span class="q ${q[0]}">${l}: ${q[1].replace(" Tag","")}</span>`}).join("");
  return `<section class="block" style="margin-top:6px">
    <div class="block-head"><h2>Mondkalender</h2><span class="spacer"></span>
      <div class="row"><button class="iconbtn" data-calm="-1" aria-label="Voriger Monat"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <strong style="min-width:130px;text-align:center">${fmt(first,{month:"long",year:"numeric"})}</strong>
      <button class="iconbtn" data-calm="1" aria-label="Nächster Monat"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>
    <div class="cal">${cells}</div>
    <div class="legend">${Object.values(EL).map(e=>`<span style="--el:var(${e.v})"><i></i>${e.n}</span>`).join("")}<span>↑ aufsteigend</span><span>↓ absteigend</span></div>
    <div class="daycard"><div>${moonSVG(sm,64)}</div><div style="min-width:0"><div class="eyebrow">${esc(fLong(sd))}</div><h3 style="font-size:21px;margin:2px 0">${esc(sm.phase)} · <span style="color:var(${se.v})">${se.n}</span></h3><div class="muted" style="font-size:14px">Mond in ${esc(sm.sign)}, ${sm.asc?"aufsteigend":"absteigend"}, ${Math.round(sm.illum*100)}&nbsp;% beleuchtet</div><div class="tmeta">${actions}</div></div></div>
    <div class="explain">
      <div class="tip"><h3>Zu- und abnehmend</h3><p>Abnehmender Mond gilt als Zeit für Schnitt, Düngung und Pflege, weil die Säfte nach unten ziehen. Zunehmender Mond ist Säzeit.</p></div>
      <div class="tip"><h3>Auf- und absteigend</h3><p>Der absteigende Mond ist die traditionelle Pflanzzeit: Wurzeln wachsen gut an. Aufsteigend ist Erntezeit für Obst und Kräuter.</p></div>
      <div class="tip"><h3>Element-Tage</h3><p>Je nach Tierkreiszeichen ist Blüten-, Blatt-, Frucht- oder Wurzeltag. Arbeiten an einer Pflanze passen am besten zu ihrem Teil: Rosen an Blütentagen, Hecken an Blatttagen, Zwiebeln an Wurzeltagen.</p></div>
    </div>
    <div class="note"><strong>Zur Einordnung.</strong> Ein Einfluss des Mondes auf das Pflanzenwachstum ist wissenschaftlich nicht belegt. Entscheidend sind Jahreszeit, Wetter und Boden. Deshalb setzt der Plan immer zuerst das gärtnerisch richtige Zeitfenster und wählt erst darin den günstigsten Mondtag. Die Mondposition wird näherungsweise berechnet (siderischer Tierkreis), an Zeichenwechseln kann sie um einen Tag von gedruckten Kalendern abweichen.</div>
  </section>`;
}

        <div class="two"><div class="field"><label for="memail">E-Mail</label><input id="memail" type="email" required placeholder="name@beispiel.li"></div>
        <div class="field"><label for="mrole">Rolle</label><select id="mrole">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k==="admin"?"selected":""}>${r.n}</option>`).join("")}</select></div></div>
        <div class="hint muted" style="font-size:13px">Danach kann sich die Person mit dieser Adresse anmelden. Mit dem eingebauten Supabase-Mailversand muss sie zusätzlich im Supabase-Team sein (siehe Anleitung).</div>

/* ---------- Sheets ---------- */
function sheet(html){
  $("#sheetroot").innerHTML=`<div class="overlay" data-close><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow="hidden";
  const f=$("#sheetroot input,#sheetroot select,#sheetroot textarea"); if(f&&window.innerWidth>700) f.focus();
}
function closeSheet(){$("#sheetroot").innerHTML="";document.body.style.overflow=""}
const closeBtn=`<span class="spacer"></span><button class="iconbtn" data-x aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>`;

function zoneForm(z){

  sheet(`<div class="sheet-h"><div><div class="eyebrow">${isNew?"Neue Zone":"Zone bearbeiten"}</div><h2>${isNew?"Ort im Garten":esc(z.name)}</h2></div>${closeBtn}</div>

    <div class="two"><div class="field"><label for="zkind">Art</label><select id="zkind">${["Beet","Rabatte","Kübel & Töpfe","Hecke","Rasen","Gehölz","Kräutergarten","Obstgarten","Balkon & Terrasse","Hang & Böschung"].map(o=>`<option ${o===z.kind?"selected":""}>${o}</option>`).join("")}</select></div>
    <div class="field"><label for="zlight">Lage</label><select id="zlight">${["Sonne","Halbschatten","Schatten"].map(o=>`<option ${o===z.light?"selected":""}>${o}</option>`).join("")}</select></div></div>
    <div class="field"><label>Farbe</label><div class="swatches">${ZCOLORS.map((c,i)=>`<label style="--sw:${c}"><input type="radio" name="zcol" id="zcol${i}" value="${c}" ${c===z.color?"checked":""}><span></span></label>`).join("")}</div></div>
    <div class="field"><label for="znote">Notiz</label><textarea id="znote" maxlength="400" placeholder="Boden, Besonderheiten, z. B. lehmig, windgeschützt">${esc(z.note||"")}</textarea></div>

function pickPlant(zoneId){

function info(cid){
  const c=CAT[cid];
  const rows=c.t.map(t=>{const [type,f,to]=t;const [fm]=f.split("-").map(Number),[tm]=to.split("-").map(Number);const tt=TT[type];
    let cells="";for(let m=1;m<=12;m++){const on=fm<=tm?(m>=fm&&m<=tm):(m>=fm||m<=tm);cells+=`<div style="padding:0 1px">${on?`<div class="bar" style="--c:var(${tt.c})"></div>`:""}</div>`}
    return `<div class="lab" style="color:var(${tt.c})">${tt.l}</div>${cells}`}).join("");
  const mh=MONTHS.map((m,i)=>`<div class="mh ${i===TODAY.getMonth()?"cur":""}">${m.slice(0,1)}</div>`).join("");
  sheet(`<div class="sheet-h"><div class="g" style="width:56px;height:56px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:none">${glyph(c.c,40)}</div><div style="min-width:0"><div class="eyebrow">${esc(c.c)}</div><h2>${esc(c.n)}</h2><div class="muted" style="font-style:italic">${esc(c.b)}</div></div>${closeBtn}</div>
  <div class="steckbrief">
    <div class="chips" style="margin:0 0 12px"><span class="chip">${esc(c.l)}</span><span class="chip">${water(c.w)}</span><span class="chip">${esc(c.h)}</span><span class="chip"><span class="dot" style="--c:var(${EL[c.e].v})"></span>${EL[c.e].s}-Pflanze</span></div>
    <p>${esc(c.d)}</p>
    <div class="eyebrow" style="margin-top:14px">Jahresplan</div>
    <div class="yearplan"><div class="yp"><div></div>${mh}${rows}</div></div>
    <div class="eyebrow" style="margin-top:16px">Was wann zu tun ist</div>
    <div class="tlist">${c.t.map(([type,f,to,txt])=>{const [fm,fd]=f.split("-").map(Number),[tm,td]=to.split("-").map(Number);return `<div style="--c:var(${TT[type].c})"><b>${TT[type].l} · ${fd}. ${MONTHS[fm-1]} – ${td}. ${MONTHS[tm-1]}</b>${esc(txt)}</div>`}).join("")}</div>
    ${me.canPlants?`<div class="actions" style="margin-top:16px"><button class="btn primary" data-plantcat="${c.id}">${plus()}In eine Zone setzen</button></div>`:""}
  </div>`);
}

/* ---------- Ereignisse ---------- */
let delArm=null;
document.addEventListener("click",async e=>{
  const b=e.target.closest("button,[data-close]"); if(!b) return;
  const d=b.dataset;
  if(d.close!==undefined&&e.target===b){closeSheet();return}
  if(d.x!==undefined){closeSheet();return}
  if(d.tab){go(d.tab);return}
  if(d.go){go(d.go);return}
  if(d.range){UI.range=d.range;LS.set("range",d.range);render();return}
  if(d.zf){UI.zoneF=d.zf;render();return}
  if(d.tf){UI.typeF=d.tf;render();return}
  if(d.toggle){UI.open.has(d.toggle)?UI.open.delete(d.toggle):UI.open.add(d.toggle);render();return}
  if(d.done||d.skip){const k=d.done||d.skip;const [pid,tid,y]=k.split("~");await guard(api.set("done",k,{pid,tid,y:Number(y),date:dkey(TODAY),skipped:!!d.skip,by:me.id||null}),d.done?"Erledigt":"Für dieses Jahr ausgelassen");return}
  if(d.undo){await guard(api.del("done",d.undo),"Zurückgesetzt");return}
  if(d.zone){UI.zone=d.zone;render();window.scrollTo({top:0});return}
  if(d.back!==undefined){UI.zone=null;render();return}
  if(d.newzone!==undefined){zoneForm();return}
  if(d.editzone){zoneForm(S.zones.find(z=>z.id===d.editzone));return}
  if(d.addplant){pickPlant(d.addplant);return}
  if(d.pick){plantingForm({cat:d.pick,zoneId:d.pz});return}
  if(d.plantcat){plantingForm({cat:d.plantcat,zoneId:UI.zone});return}
  if(d.editp){plantingForm({p:S.plantings.find(p=>p.id===d.editp)});return}
  if(d.info){info(d.info);return}
  if(d.cat){UI.catC=d.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.cat===d.cat));renderCatList();return}
  if(d.calm){UI.calM=new Date(UI.calM.getFullYear(),UI.calM.getMonth()+Number(d.calm),1);render();return}
  if(d.cal){UI.calSel=d.cal;render();return}
  if(d.delzone){
    if(delArm!==b){delArm=b;b.classList.add("sure");const n=S.plantings.filter(p=>p.zoneId===d.delzone).length;b.textContent=n?`Zone und ${n} Pflanzen löschen?`:"Wirklich löschen?";return}
    if(await guard(api.del("zones",d.delzone),"Zone gelöscht")){closeSheet();UI.zone=null;render()}
    return}
  if(d.delp){
    if(delArm!==b){delArm=b;b.classList.add("sure");b.textContent="Wirklich entfernen?";return}
    if(await guard(api.del("plantings",d.delp),"Pflanze entfernt")) closeSheet();
    return}
});
document.addEventListener("input",e=>{
  if(e.target.id==="catq"){UI.catQ=e.target.value;renderCatList()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="rfrom"){UI.from=e.target.value||UI.from;render()}
  if(e.target.id==="rto"){UI.to=e.target.value||UI.to;render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheetroot").innerHTML)closeSheet()});
let tt=null;
function toast(msg){const r=$("#toastroot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(tt);tt=setTimeout(()=>r.innerHTML="",2400)}

/* ---------- Team-Aktionen ---------- */
document.addEventListener("submit",async e=>{
  if(e.target.id==="mform"){e.preventDefault();
    const email=$("#memail").value.trim().toLowerCase(), role=$("#mrole").value;
    if(!email) return;
    if(await guard(api.set("members",email,{role}),"Freigeschaltet")) render();
  }
});
document.addEventListener("change",async e=>{
  if(e.target.classList.contains("memrole")) await guard(api.update("members",e.target.dataset.mem,{role:e.target.value}),"Rolle geändert");
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.logout!==undefined){await sb.auth.signOut();location.reload()}
  if(b.dataset.delmem){
    if(delArm!==b){delArm=b;b.classList.add("sure");b.style.background="var(--danger)";b.style.color="var(--surface)";return}
    await guard(api.del("members",b.dataset.delmem),"Entfernt");
  }
  if(b.id==="mechip"){go("team")}
});

/* ---------- Anmeldung ---------- */
function gate(html){
  document.body.classList.add("gated");
  $("#mechip").hidden=true;
  $("#view").innerHTML=`<section class="gate">${html}</section>`;
}
function gateHero(){const m=moon(TODAY);return `<div class="gate-moon">${moonSVG(m,84)}</div>`}
function showSetup(){
  gate(`${gateHero()}<h2>Fast fertig</h2><p class="muted">In der Datei <code>config.js</code> fehlen noch die Supabase-Adresse und der Schlüssel. Die Anleitung in <code>README.md</code> zeigt, wo du beides findest.</p>`);
}
function showLogin(msg){
  gate(`${gateHero()}<div class="eyebrow">${esc(fLong(TODAY))}</div><h2>Willkommen im Garten</h2>
  <p class="muted">Gib deine E-Mail-Adresse ein. Du bekommst einen Login-Link und einen 6-stelligen Code.</p>
  <form class="form" id="lform"><div class="field"><label for="lemail">E-Mail</label><input id="lemail" type="email" required autocomplete="email" value="${esc(LS.get("email",""))}"></div>
  <button class="btn primary" type="submit">Login-Link senden</button></form>
  ${msg?`<p class="gate-msg">${esc(msg)}</p>`:""}`);
  $("#lform").addEventListener("submit",async e=>{e.preventDefault();
    const email=$("#lemail").value.trim().toLowerCase(); if(!email) return; LS.set("email",email);
    const btn=e.target.querySelector("button"); btn.disabled=true; btn.textContent="Wird gesendet …";
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});
    if(error){showLogin(/rate|seconds/i.test(error.message)?"Zu viele Versuche. Warte ein paar Minuten und versuche es dann nochmal.":/not authorized|authorized/i.test(error.message)?"Diese Adresse darf noch keine Mails von Supabase bekommen. Lade sie im Supabase-Team ein oder richte einen eigenen Mailversand ein (siehe Anleitung).":"Senden hat nicht geklappt: "+error.message);return}
    showCode(email);
  });
}
function showCode(email){
  gate(`${gateHero()}<h2>Schau in dein Postfach</h2>
  <p class="muted">Wir haben eine Mail an <strong>${esc(email)}</strong> geschickt. Tippe auf den Link oder gib hier den Code aus der Mail ein. Der Code ist praktisch, wenn du die App vom Home-Bildschirm aus nutzt.</p>
  <form class="form" id="cform"><div class="field"><label for="lcode">Code</label><input id="lcode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456"></div>
  <div class="actions"><button class="btn primary" type="submit">Anmelden</button><button class="btn" type="button" id="lback">Andere Adresse</button></div></form>`);
  $("#lback").addEventListener("click",()=>showLogin());
  $("#cform").addEventListener("submit",async e=>{e.preventDefault();
    const token=$("#lcode").value.replace(/\s/g,""); if(!token) return;
    const {data,error}=await sb.auth.verifyOtp({email,token,type:"email"});
    if(error){toast("Code stimmt nicht oder ist abgelaufen.");return}
    if(data.session) boot(data.session);
  });
}
function showNoAccess(){
  gate(`${gateHero()}<h2>Noch nicht freigeschaltet</h2><p class="muted">Du bist als <strong>${esc(me.email)}</strong> angemeldet, aber diese Adresse steht noch nicht in der Mitgliederliste. Bitte den Verwalter, dich unter „Team“ freizuschalten.</p><button class="btn" data-logout>Abmelden</button>`);
}
let channel=null;
async function boot(session){
  if(booted) return;
  me.email=(session.user.email||"").toLowerCase(); me.id=session.user.id;
  try{if(/access_token|error_description/.test(location.hash)) history.replaceState(null,"",location.pathname)}catch(e){}
  const {data:mrow}=await sb.from("members").select("*").eq("email",me.email).maybeSingle();
  if(!mrow){showNoAccess();return}
  me.role=mrow.role; me.canZones=me.role==="admin"; me.canPlants=me.role!=="read";
  booted=true; document.body.classList.remove("gated");
  render();
  await loadAll();
  sb.rpc("touch_me").then(()=>{},()=>{});
  channel=sb.channel("garten");
  for(const t of ["zones","plantings","done","members"]) channel.on("postgres_changes",{event:"*",schema:"public",table:t},()=>load(t));
  channel.subscribe();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") loadAll()});
}
(async()=>{
  const t=LS.get("tab","plan"); if(TABS.some(x=>x[0]===t)) UI.tab=t;
  const cfg=window.GARTENMOND_CONFIG||{};
  if(!window.supabase){gate(`${gateHero()}<h2>Keine Verbindung</h2><p class="muted">Die App konnte nicht laden. Prüfe deine Internetverbindung und lade die Seite neu.</p>`);return}
  if(!cfg.url||!cfg.key||/DEIN/.test(cfg.url+cfg.key)){showSetup();return}
  sb=supabase.createClient(cfg.url,cfg.key,{auth:{flowType:"implicit",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,session)=>{if(session&&!booted&&(ev==="SIGNED_IN"||ev==="INITIAL_SESSION")) boot(session)});
  const {data}=await sb.auth.getSession();
  if(data.session) boot(data.session); else showLogin();
})();
})();
</script>
</body>
</html>
